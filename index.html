<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Keychain STL Generator</title>
    <style>
        :root {
            --bg-color: #e9ecef;
            --sidebar-bg: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
            --border-color: #cccccc;
            --input-bg: #ffffff;
            --button-bg: #28a745;
            --button-hover: #218838;
            --shadow-color: rgba(0,0,0,0.1);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --sidebar-bg: #1e1e24;
            --text-color: #f8f9fa;
            --text-muted: #aaaaaa;
            --border-color: #444444;
            --input-bg: #2b2b36;
            --button-bg: #2ea043;
            --button-hover: #238636;
            --shadow-color: rgba(0,0,0,0.5);
        }

        body { 
            margin: 0; font-family: sans-serif; display: flex; height: 100vh; 
            background-color: var(--bg-color); color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            overflow: hidden;
        }
        
        #sidebar { 
            width: 360px; 
            background: var(--sidebar-bg); 
            padding: 20px; 
            box-shadow: 2px 0 5px var(--shadow-color); 
            z-index: 10; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            overflow-y: auto;
            transition: background-color 0.3s;
        }
        
        #canvas-container { flex-grow: 1; position: relative; overflow: hidden; background: #000; }
        
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-group.horizontal { flex-direction: row; align-items: center; justify-content: space-between; }
        
        input[type="text"], input[type="file"], select, input[type="number"], input[type="color"] { 
            padding: 8px; font-size: 14px; 
            border: 1px solid var(--border-color); 
            border-radius: 4px; 
            background-color: var(--input-bg);
            color: var(--text-color);
            width: 100%; box-sizing: border-box;
        }

        select { cursor: pointer; }
        input[type="color"] { cursor: pointer; height: 40px; border: none; padding: 0; }
        .help-text { font-size: 11px; color: var(--text-muted); margin-top: -3px; line-height: 1.3;}

        .input-row { display: flex; align-items: center; gap: 10px; }
        .input-row input[type="range"] { flex-grow: 1; cursor: pointer; }
        .input-row input[type="number"] { width: 65px; text-align: right; }
        .unit-label { font-size: 12px; color: var(--text-muted); }
        
        .split-row { display: flex; gap: 10px; }
        .split-row > div { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        
        button { 
            padding: 12px; font-size: 16px; font-weight: bold;
            background-color: var(--button-bg); color: white; 
            border: none; border-radius: 4px; cursor: pointer; 
            transition: background 0.3s; margin-top: 10px;
            flex-shrink: 0;
        }
        button:hover { background-color: var(--button-hover); }
        
        canvas { display: block; width: 100%; height: 100%; }
        
        #status-banner {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            padding: 8px 16px; border-radius: 6px; font-weight: bold;
            display: none; z-index: 20; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            text-align: center; max-width: 80%;
        }
        .status-loading { background: #ffc107; color: #333; }
        .status-error { background: #dc3545; color: white; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="sidebar">
        <div class="control-group horizontal" title="Toggle between light and dark UI themes.">
            <h2 style="margin: 0;">Settings</h2>
            <select id="themeSelect" style="width: auto; padding: 4px 8px;">
                <option value="system">System</option>
                <option value="dark">Dark</option>
                <option value="light">Light</option>
            </select>
        </div>
        
        <div class="control-group" title="The words to generate in 3D.">
            <label for="nameInput">Text:</label>
            <input type="text" id="nameInput" value="Maker" maxlength="15">
        </div>

        <div class="control-group" title="Select a 3D-ready font.">
            <label for="fontSelect">Web Font (Native 3D Format):</label>
            <select id="fontSelect">
                <option value="https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json" selected>Helvetiker Bold (Default)</option>
                <option value="https://unpkg.com/three@0.160.0/examples/fonts/optimer_bold.typeface.json">Optimer Bold (Modern)</option>
                <option value="https://unpkg.com/three@0.160.0/examples/fonts/gentilis_bold.typeface.json">Gentilis Bold (Serif)</option>
                <option value="https://unpkg.com/three@0.160.0/examples/fonts/droid/droid_sans_bold.typeface.json">Droid Sans Bold (Tech)</option>
            </select>
        </div>

        <div class="control-group" title="Upload a .ttf file from your computer.">
            <label for="fontUpload">Or Upload Local Font (.ttf):</label>
            <input type="file" id="fontUpload" accept=".ttf">
        </div>

        <hr style="width: 100%; border: 0.5px solid var(--border-color); margin: 5px 0;">

        <div class="split-row">
            <div title="Visual color of the text.">
                <label for="textColorInput">Text Color</label>
                <input type="color" id="textColorInput" value="#00d2ff">
            </div>
            <div title="Visual color of the base and ring.">
                <label for="plateColorInput">Plate & Ring Color</label>
                <input type="color" id="plateColorInput" value="#333333">
            </div>
        </div>

        <hr style="width: 100%; border: 0.5px solid var(--border-color); margin: 5px 0;">

        <div class="split-row">
            <div title="The shape of the backplate.">
                <label>Base Style</label>
                <select id="baseStyle">
                    <option value="rounded" selected>Rounded Plate</option>
                    <option value="box">Sharp Box</option>
                    <option value="none">None (Text Only)</option>
                </select>
            </div>
            <div title="Where the ring attaches.">
                <label>Ring Position</label>
                <select id="ringPos">
                    <option value="left" selected>Left</option>
                    <option value="right">Right</option>
                    <option value="top">Top</option>
                    <option value="bottom">Bottom</option>
                </select>
            </div>
        </div>

        <hr style="width: 100%; border: 0.5px solid var(--border-color); margin: 5px 0;">

        <div class="control-group" title="Overall size of the letters.">
            <label>Font Size</label>
            <div class="input-row">
                <input type="range" id="fontSize" min="5" max="30" step="0.5" value="10">
                <input type="number" id="fontSizeNum" min="5" max="50" step="0.5" value="10">
                <span class="unit-label">mm</span>
            </div>
        </div>

        <div class="control-group" title="Height of the letters. Optimized for sharp bottom and rounded top.">
            <label>Text Thickness (Z)</label>
            <div class="input-row">
                <input type="range" id="textDepth" min="0.5" max="10" step="0.5" value="2">
                <input type="number" id="textDepthNum" min="0.5" max="20" step="0.5" value="2">
                <span class="unit-label">mm</span>
            </div>
        </div>

        <div class="control-group" title="Sinks text into the base. Set to 0 to keep text perfectly flush and avoid extra filament swaps.">
            <label>Embed Text into Base (Sink)</label>
            <div class="input-row">
                <input type="range" id="sinkDepth" min="0" max="2" step="0.1" value="0">
                <input type="number" id="sinkDepthNum" min="0" max="5" step="0.1" value="0">
                <span class="unit-label">mm</span>
            </div>
        </div>

        <div class="control-group" title="Shift text horizontally.">
            <label>Text Nudge X</label>
            <div class="input-row">
                <input type="range" id="nudgeX" min="-15" max="15" step="0.5" value="0">
                <input type="number" id="nudgeXNum" min="-50" max="50" step="0.5" value="0">
                <span class="unit-label">mm</span>
            </div>
        </div>

        <div class="control-group" title="Shift text vertically.">
            <label>Text Nudge Y</label>
            <div class="input-row">
                <input type="range" id="nudgeY" min="-15" max="15" step="0.5" value="0">
                <input type="number" id="nudgeYNum" min="-50" max="50" step="0.5" value="0">
                <span class="unit-label">mm</span>
            </div>
        </div>

        <hr style="width: 100%; border: 0.5px solid var(--border-color); margin: 5px 0;">

        <div class="control-group" title="Extra space around the text.">
            <label>Base Plate Padding</label>
            <div class="input-row">
                <input type="range" id="basePadding" min="0" max="15" step="0.5" value="2">
                <input type="number" id="basePaddingNum" min="0" max="30" step="0.5" value="2">
                <span class="unit-label">mm</span>
            </div>
        </div>

        <div class="control-group" title="Thickness of the backplate.">
            <label>Base Thickness (Z)</label>
            <div class="input-row">
                <input type="range" id="baseThickness" min="0.5" max="10" step="0.5" value="2">
                <input type="number" id="baseThicknessNum" min="0.5" max="20" step="0.5" value="2">
                <span class="unit-label">mm</span>
            </div>
        </div>

        <div class="control-group" title="Size of the ring hole.">
            <label>Ring Inner Radius</label>
            <div class="input-row">
                <input type="range" id="ringSize" min="2" max="15" step="0.5" value="3">
                <input type="number" id="ringSizeNum" min="2" max="30" step="0.5" value="3">
                <span class="unit-label">mm</span>
            </div>
        </div>

        <div class="control-group" title="Thickness of the ring loop.">
            <label>Ring Tube Diameter</label>
            <div class="input-row">
                <input type="range" id="ringThick" min="0.5" max="5" step="0.1" value="2">
                <input type="number" id="ringThickNum" min="0.5" max="10" step="0.1" value="2">
                <span class="unit-label">mm</span>
            </div>
        </div>

        <button id="exportBtn" title="Download the 3D model.">Download STL</button>
    </div>

    <div id="canvas-container">
        <div id="status-banner">Processing...</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TTFLoader } from 'three/addons/loaders/TTFLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
        import { STLExporter } from 'three/addons/exporters/STLExporter.js';
        import { ViewHelper } from 'three/addons/helpers/ViewHelper.js';

        // --- SCENE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 1000);
        camera.position.set(0, -60, 70);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.autoClear = false; // Required for ViewHelper overlay
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- VIEW HELPER SETUP (Orientation Axis) ---
        const viewHelper = new ViewHelper(camera, renderer.domElement);
        viewHelper.center.set(0, 0, 0);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
        dirLight.position.set(20, -20, 40);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- THEME MANAGEMENT ---
        const themeSelect = document.getElementById('themeSelect');
        const prefersDarkScheme = window.matchMedia("(prefers-color-scheme: dark)");

        function applyTheme(theme) {
            let isDark = theme === 'dark' || (theme === 'system' && prefersDarkScheme.matches);
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            scene.background = new THREE.Color(isDark ? 0x1a1a20 : 0xe9ecef);
        }

        themeSelect.addEventListener('change', (e) => applyTheme(e.target.value));
        applyTheme('system');

        // --- GLOBAL VARIABLES ---
        let loadedFont = null, keychainMesh = null; 
        const fontLoader = new FontLoader(), ttfLoader = new TTFLoader();
        const statusBanner = document.getElementById('status-banner');

        function loadSelectedFont() {
            statusBanner.style.display = 'block';
            fontLoader.load(document.getElementById('fontSelect').value, (font) => { 
                loadedFont = font; statusBanner.style.display = 'none'; generateKeychain(); 
            });
        }

        document.getElementById('fontUpload').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                loadedFont = fontLoader.parse(ttfLoader.parse(e.target.result));
                document.getElementById('fontSelect').value = ""; generateKeychain(); 
            };
            reader.readAsArrayBuffer(file);
        });

        // --- GENERATION LOGIC ---
        function generateKeychain() {
            if (!loadedFont) return;
            const text = document.getElementById('nameInput').value.trim() || "Maker";
            const textColor = document.getElementById('textColorInput').value; 
            const plateColor = document.getElementById('plateColorInput').value; 
            const fontSize = parseFloat(document.getElementById('fontSizeNum').value);
            const targetTextDepth = parseFloat(document.getElementById('textDepthNum').value);
            const sinkDepth = parseFloat(document.getElementById('sinkDepthNum').value);
            const nudgeX = parseFloat(document.getElementById('nudgeXNum').value);
            const nudgeY = parseFloat(document.getElementById('nudgeYNum').value);
            const padding = parseFloat(document.getElementById('basePaddingNum').value);
            const baseThickness = parseFloat(document.getElementById('baseThicknessNum').value);
            const ringRadius = parseFloat(document.getElementById('ringSizeNum').value);
            const ringTubeRadius = parseFloat(document.getElementById('ringThickNum').value) / 2;
            const baseStyle = document.getElementById('baseStyle').value;
            const ringPos = document.getElementById('ringPos').value;

            if (keychainMesh) scene.remove(keychainMesh);
            keychainMesh = new THREE.Group();
            const textMat = new THREE.MeshStandardMaterial({ color: textColor });
            const baseMat = new THREE.MeshStandardMaterial({ color: plateColor });

            // Bevel for top rounding
            const bevelThickness = 0.5;
            const actualTextDepth = baseStyle === 'none' ? targetTextDepth : targetTextDepth + sinkDepth;
            
            let textGeo = new TextGeometry(text, { 
                font: loadedFont, 
                size: fontSize, 
                height: actualTextDepth, 
                bevelEnabled: true, 
                bevelThickness: bevelThickness, 
                bevelSize: 0.2,
                bevelSegments: 5 
            });
            
            textGeo.computeBoundingBox();
            const centerOffsetX = -0.5 * (textGeo.boundingBox.max.x + textGeo.boundingBox.min.x);
            const centerOffsetY = -0.5 * (textGeo.boundingBox.max.y + textGeo.boundingBox.min.y);
            
            // Correction to ensure vertical wall at plate contact (Sharp Base)
            textGeo.translate(centerOffsetX, centerOffsetY, -textGeo.boundingBox.min.z + (baseStyle === 'none' ? 0 : -0.1));

            const textWidth = textGeo.boundingBox.max.x - textGeo.boundingBox.min.x;
            const textHeight = textGeo.boundingBox.max.y - textGeo.boundingBox.min.y;
            const textMesh = new THREE.Mesh(textGeo, textMat);
            textMesh.castShadow = true; textMesh.receiveShadow = true;

            if (baseStyle !== 'none') {
                const shape = new THREE.Shape();
                const r = baseStyle === 'rounded' ? Math.min(padding, textHeight / 2, textWidth / 2) : 0;
                const baseW = textWidth + (padding * 2);
                const baseH = textHeight + (padding * 2);
                const x = -baseW / 2, y = -baseH / 2;

                shape.moveTo(x, y + r); shape.lineTo(x, y + baseH - r);
                shape.quadraticCurveTo(x, y + baseH, x + r, y + baseH);
                shape.lineTo(x + baseW - r, y + baseH); shape.quadraticCurveTo(x + baseW, y + baseH, x + baseW, y + baseH - r);
                shape.lineTo(x + baseW, y + r); shape.quadraticCurveTo(x + baseW, y, x + baseW - r, y);
                shape.lineTo(x + r, y); shape.quadraticCurveTo(x, y, x, y + r);
                
                const plateMesh = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: baseThickness, bevelEnabled: false }), baseMat);
                plateMesh.castShadow = true; plateMesh.receiveShadow = true;
                keychainMesh.add(plateMesh);
                textMesh.position.set(nudgeX, nudgeY, baseThickness - sinkDepth);
            } else {
                textMesh.position.set(nudgeX, nudgeY, 0);
            }
            keychainMesh.add(textMesh);

            const ringGeo = new THREE.TorusGeometry(ringRadius, ringTubeRadius, 16, 32);
            ringGeo.translate(0, 0, ringTubeRadius);
            const ringMesh = new THREE.Mesh(ringGeo, baseMat);
            ringMesh.castShadow = true; ringMesh.receiveShadow = true;
            const finalW = baseStyle === 'none' ? textWidth : textWidth + (padding * 2);
            const finalH = baseStyle === 'none' ? textHeight : textHeight + (padding * 2);
            let rX = ringPos === 'left' ? -(finalW / 2) - ringRadius : (ringPos === 'right' ? (finalW / 2) + ringRadius : 0);
            let rY = ringPos === 'top' ? (finalH / 2) + ringRadius : (ringPos === 'bottom' ? -(finalH / 2) - ringRadius : 0);
            ringMesh.position.set(rX, rY, 0);
            keychainMesh.add(ringMesh);

            scene.add(keychainMesh);
        }

        // --- EXPORT & UI EVENTS ---
        document.getElementById('exportBtn').addEventListener('click', () => {
            const exporter = new STLExporter();
            const link = document.createElement('a');
            link.href = URL.createObjectURL(new Blob([exporter.parse(scene)], { type: 'text/plain' }));
            link.download = (document.getElementById('nameInput').value || 'keychain') + '.stl'; 
            link.click();
        });

        const ids = ['fontSize', 'textDepth', 'sinkDepth', 'nudgeX', 'nudgeY', 'basePadding', 'baseThickness', 'ringSize', 'ringThick'];
        ids.forEach(id => {
            const s = document.getElementById(id), n = document.getElementById(id + 'Num');
            s.addEventListener('input', () => { n.value = s.value; generateKeychain(); });
            n.addEventListener('input', () => { s.value = n.value; generateKeychain(); });
        });
        ['fontSelect', 'baseStyle', 'ringPos', 'textColorInput', 'plateColorInput', 'nameInput'].forEach(id => document.getElementById(id).addEventListener('input', generateKeychain));

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        loadSelectedFont();

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            
            renderer.clear();
            renderer.render(scene, camera);
            
            // Render the Orientation Helper in the corner
            viewHelper.render(renderer);
        }
        animate();
    </script>
</body>
</html>
