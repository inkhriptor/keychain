<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Keychain STL Generator</title>
    
    <link rel="icon" type="image/png" href="icon.png">
    
    <style>
        :root {
            --bg-color: #e9ecef;
            --sidebar-bg: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
            --border-color: #cccccc;
            --input-bg: #ffffff;
            --button-bg: #28a745;
            --button-hover: #218838;
            --shadow-color: rgba(0,0,0,0.1);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --sidebar-bg: #1e1e24;
            --text-color: #f8f9fa;
            --text-muted: #aaaaaa;
            --border-color: #444444;
            --input-bg: #2b2b36;
            --button-bg: #2ea043;
            --button-hover: #238636;
            --shadow-color: rgba(0,0,0,0.5);
        }

        body { 
            margin: 0; font-family: sans-serif; display: flex; height: 100vh; 
            background-color: var(--bg-color); color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            overflow: hidden;
        }
        
        #sidebar { 
            width: 380px; 
            background: var(--sidebar-bg); 
            padding: 20px; 
            box-shadow: 2px 0 5px var(--shadow-color); 
            z-index: 10; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            overflow-y: auto;
        }
        
        #canvas-container { flex-grow: 1; position: relative; overflow: hidden; background: #000; }
        
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        .control-group.horizontal { flex-direction: row; align-items: center; justify-content: space-between; }
        
        input[type="text"], input[type="file"], select, input[type="number"], input[type="color"], textarea { 
            padding: 8px; font-size: 14px; 
            border: 1px solid var(--border-color); 
            border-radius: 4px; 
            background-color: var(--input-bg);
            color: var(--text-color);
            width: 100%; box-sizing: border-box;
            font-family: sans-serif;
        }

        textarea { resize: vertical; }
        select { cursor: pointer; }
        input[type="color"] { cursor: pointer; height: 40px; border: none; padding: 0; }
        input[type="checkbox"] { width: auto; transform: scale(1.2); margin-right: 8px; cursor: pointer; }
        .help-text { font-size: 11px; color: var(--text-muted); margin-top: -3px; line-height: 1.3;}

        .input-row { display: flex; align-items: center; gap: 10px; }
        .input-row input[type="range"] { flex-grow: 1; cursor: pointer; }
        .input-row input[type="number"] { width: 65px; text-align: right; }
        .unit-label { font-size: 12px; color: var(--text-muted); }
        
        .split-row { display: flex; gap: 10px; }
        .split-row > div { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        
        button { 
            padding: 12px; font-size: 16px; font-weight: bold;
            background-color: var(--button-bg); color: white; 
            border: none; border-radius: 4px; cursor: pointer; 
            transition: background 0.3s; margin-top: 10px;
        }
        button:hover { background-color: var(--button-hover); }
        
        #status-banner {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            padding: 8px 16px; border-radius: 6px; font-weight: bold;
            display: none; z-index: 20; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            text-align: center; max-width: 80%;
        }
        .status-loading { background: #ffc107; color: #333; }
        .status-error { background: #dc3545; color: white; }

        #resetCameraBtn {
            position: absolute; bottom: 20px; left: 20px; z-index: 20; 
            padding: 8px 12px; font-size: 14px; margin-top: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* --- MOBILE RESPONSIVENESS --- */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { 
                width: 100%; height: 50vh; flex-grow: 0; 
                box-shadow: 0 -2px 5px var(--shadow-color); order: 2; 
            }
            #canvas-container { width: 100%; height: 50vh; flex-grow: 0; order: 1; }
            #resetCameraBtn { bottom: 15px; left: 15px; padding: 6px 10px; font-size: 12px; }
        }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="sidebar">
        <div class="control-group horizontal" title="Toggle theme">
            <h2 style="margin: 0;">Settings</h2>
            <select id="themeSelect" style="width: auto; padding: 4px 8px;">
                <option value="system">System</option>
                <option value="dark">Dark</option>
                <option value="light">Light</option>
            </select>
        </div>
        
        <div class="control-group" title="Enter multiple lines for batch generation or multi-line keychains.">
            <label for="nameInput">Text (One per line):</label>
            <textarea id="nameInput" rows="4">Maker&#10;Space</textarea>
        </div>

        <div class="split-row">
            <div title="Single multi-line keychain, or Batch mode (one keychain per line).">
                <label>Mode</label>
                <select id="genMode">
                    <option value="single">Single (Multi-line)</option>
                    <option value="batch" selected>Batch (1 per line)</option>
                </select>
            </div>
            <div title="Arrange on a virtual build plate.">
                <label>Build Plate Layout</label>
                <select id="printerPlate">
                    <option value="none">Free (Center)</option>
                    <option value="a1mini" selected>A1 Mini (180x180)</option>
                    <option value="a1">A1 (256x256)</option>
                </select>
            </div>
        </div>
        
        <div class="control-group" style="flex-direction: row; align-items: center; margin-top: 5px;" title="Uncheck to use the whole plate for single-color prints.">
            <input type="checkbox" id="primeTower" checked>
            <label for="primeTower" style="cursor: pointer; font-size: 13px;">Avoid Prime Tower (Multi-color)</label>
        </div>

        <hr style="width: 100%; border: 0.5px solid var(--border-color); margin: 5px 0;">

        <div class="control-group" title="Select from over 20+ Free Web Fonts.">
            <label for="fontSelect">Web Font (Native & Google Fonts):</label>
            <select id="fontSelect">
                <optgroup label="Classic 3D Fonts (JSON)">
                    <option value="https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json" selected>Helvetiker Bold</option>
                    <option value="https://unpkg.com/three@0.160.0/examples/fonts/optimer_bold.typeface.json">Optimer Bold</option>
                    <option value="https://unpkg.com/three@0.160.0/examples/fonts/gentilis_bold.typeface.json">Gentilis Bold</option>
                    <option value="https://unpkg.com/three@0.160.0/examples/fonts/droid/droid_sans_bold.typeface.json">Droid Sans Bold</option>
                </optgroup>
                <optgroup label="Modern Sans-Serif (TTF)">
                    <option value="https://api.fontsource.org/v1/fonts/roboto/latin-700-normal.ttf">Roboto Bold</option>
                    <option value="https://api.fontsource.org/v1/fonts/open-sans/latin-700-normal.ttf">Open Sans Bold</option>
                    <option value="https://api.fontsource.org/v1/fonts/montserrat/latin-700-normal.ttf">Montserrat Bold</option>
                    <option value="https://api.fontsource.org/v1/fonts/poppins/latin-700-normal.ttf">Poppins Bold</option>
                </optgroup>
                <optgroup label="Serif & Display (TTF)">
                    <option value="https://api.fontsource.org/v1/fonts/merriweather/latin-700-normal.ttf">Merriweather Bold</option>
                    <option value="https://api.fontsource.org/v1/fonts/bebas-neue/latin-400-normal.ttf">Bebas Neue (Regular)</option>
                    <option value="https://api.fontsource.org/v1/fonts/righteous/latin-400-normal.ttf">Righteous</option>
                </optgroup>
                <optgroup label="Handwriting & Fun (TTF)">
                    <option value="https://api.fontsource.org/v1/fonts/pacifico/latin-400-normal.ttf">Pacifico</option>
                    <option value="https://api.fontsource.org/v1/fonts/comfortaa/latin-700-normal.ttf">Comfortaa Bold</option>
                </optgroup>
            </select>
        </div>

        <div class="control-group" title="Upload a custom .ttf file.">
            <label for="fontUpload">Or Upload Local Font (.ttf):</label>
            <input type="file" id="fontUpload" accept=".ttf">
        </div>

        <hr style="width: 100%; border: 0.5px solid var(--border-color); margin: 5px 0;">

        <div class="split-row">
            <div title="Color for the letters.">
                <label for="textColorInput">Text Color</label>
                <input type="color" id="textColorInput" value="#00d2ff">
            </div>
            <div title="Color for the plate and ring.">
                <label for="plateColorInput">Plate & Ring Color</label>
                <input type="color" id="plateColorInput" value="#333333">
            </div>
        </div>

        <hr style="width: 100%; border: 0.5px solid var(--border-color); margin: 5px 0;">

        <div class="split-row">
            <div title="Shape of the backplate.">
                <label>Base Style</label>
                <select id="baseStyle">
                    <option value="rounded" selected>Rounded Plate</option>
                    <option value="box">Sharp Box</option>
                    <option value="none">None (Text Only)</option>
                </select>
            </div>
            <div title="Ring attachment side.">
                <label>Ring Position</label>
                <select id="ringPos">
                    <option value="left" selected>Left</option>
                    <option value="right">Right</option>
                    <option value="top">Top</option>
                    <option value="bottom">Bottom</option>
                </select>
            </div>
        </div>

        <hr style="width: 100%; border: 0.5px solid var(--border-color); margin: 5px 0;">

        <div class="control-group" title="Scale of the text.">
            <label>Font Size</label>
            <div class="input-row">
                <input type="range" id="fontSize" min="5" max="30" step="0.5" value="10">
                <input type="number" id="fontSizeNum" min="5" max="50" step="0.5" value="10">
                <span class="unit-label">mm</span>
            </div>
        </div>

        <div class="control-group" title="Z-thickness of text. Perfectly flat at bottom for faster printing.">
            <label>Text Thickness (Z)</label>
            <div class="input-row">
                <input type="range" id="textDepth" min="0.5" max="10" step="0.5" value="2">
                <input type="number" id="textDepthNum" min="0.5" max="20" step="0.5" value="2">
                <span class="unit-label">mm</span>
            </div>
        </div>

        <div class="control-group" title="Set to 0 to keep text perfectly flush on the base. Default is 0.">
            <label>Embed Text into Base (Sink)</label>
            <div class="input-row">
                <input type="range" id="sinkDepth" min="0" max="2" step="0.1" value="0">
                <input type="number" id="sinkDepthNum" min="0" max="5" step="0.1" value="0">
                <span class="unit-label">mm</span>
            </div>
        </div>

        <div class="control-group" title="Shift text horizontally.">
            <label>Text Nudge X</label>
            <div class="input-row">
                <input type="range" id="nudgeX" min="-15" max="15" step="0.5" value="0">
                <input type="number" id="nudgeXNum" min="-50" max="50" step="0.5" value="0">
                <span class="unit-label">mm</span>
            </div>
        </div>

        <div class="control-group" title="Shift text vertically.">
            <label>Text Nudge Y</label>
            <div class="input-row">
                <input type="range" id="nudgeY" min="-15" max="15" step="0.5" value="0">
                <input type="number" id="nudgeYNum" min="-50" max="50" step="0.5" value="0">
                <span class="unit-label">mm</span>
            </div>
        </div>

        <hr style="width: 100%; border: 0.5px solid var(--border-color); margin: 5px 0;">

        <div class="control-group" title="Padding around text.">
            <label>Base Plate Padding</label>
            <div class="input-row">
                <input type="range" id="basePadding" min="0" max="15" step="0.5" value="2">
                <input type="number" id="basePaddingNum" min="0" max="30" step="0.5" value="2">
                <span class="unit-label">mm</span>
            </div>
        </div>

        <div class="control-group" title="Z-thickness of the plate.">
            <label>Base Thickness (Z)</label>
            <div class="input-row">
                <input type="range" id="baseThickness" min="0.5" max="10" step="0.5" value="2">
                <input type="number" id="baseThicknessNum" min="0.5" max="20" step="0.5" value="2">
                <span class="unit-label">mm</span>
            </div>
        </div>

        <div class="control-group" title="Hole radius.">
            <label>Ring Inner Radius</label>
            <div class="input-row">
                <input type="range" id="ringSize" min="2" max="15" step="0.5" value="3">
                <input type="number" id="ringSizeNum" min="2" max="30" step="0.5" value="3">
                <span class="unit-label">mm</span>
            </div>
        </div>

        <div class="control-group" title="Ring thickness.">
            <label>Ring Tube Diameter</label>
            <div class="input-row">
                <input type="range" id="ringThick" min="0.5" max="5" step="0.1" value="2">
                <input type="number" id="ringThickNum" min="0.5" max="10" step="0.1" value="2">
                <span class="unit-label">mm</span>
            </div>
        </div>

        <button id="exportBtn">Download STL</button>
    </div>

    <div id="canvas-container">
        <div id="status-banner">Processing...</div>
        <button id="resetCameraBtn" title="Reset Camera to Default View">Reset View</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TTFLoader } from 'three/addons/loaders/TTFLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
        import { STLExporter } from 'three/addons/exporters/STLExporter.js';
        import { ViewHelper } from 'three/addons/helpers/ViewHelper.js';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 1000);
        camera.position.set(0, -100, 120);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.autoClear = false;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.saveState(); 

        const viewHelper = new ViewHelper(camera, renderer.domElement);
        viewHelper.center.set(0, 0, 0);
        const clock = new THREE.Clock(); 
        
        container.addEventListener('pointerup', (event) => { viewHelper.handleClick(event); });
        document.getElementById('resetCameraBtn').addEventListener('click', () => { controls.reset(); });

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
        dirLight.position.set(20, -20, 40);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Group to hold only keychains (for exporting)
        let keychainMesh = new THREE.Group();
        scene.add(keychainMesh);

        // Group to hold visual helpers (bed grid, prime tower zone)
        let helperGroup = new THREE.Group();
        scene.add(helperGroup);

        const themeSelect = document.getElementById('themeSelect');
        const prefersDarkScheme = window.matchMedia("(prefers-color-scheme: dark)");
        function applyTheme(theme) {
            let isDark = theme === 'dark' || (theme === 'system' && prefersDarkScheme.matches);
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            scene.background = new THREE.Color(isDark ? 0x1a1a20 : 0xe9ecef);
        }
        themeSelect.addEventListener('change', (e) => applyTheme(e.target.value));
        applyTheme('system');

        let loadedFont = null; 
        const fontLoader = new FontLoader(), ttfLoader = new TTFLoader();
        const statusBanner = document.getElementById('status-banner');

        function showStatus(message, isError = false) {
            statusBanner.textContent = message;
            statusBanner.className = isError ? 'status-error' : 'status-loading';
            statusBanner.style.display = 'block';
            if (isError) setTimeout(() => statusBanner.style.display = 'none', 5000);
        }

        function loadSelectedFont() {
            const url = document.getElementById('fontSelect').value;
            if (!url) return;
            showStatus('Downloading Font...');
            if (url.endsWith('.ttf')) {
                ttfLoader.load(url, (json) => {
                    loadedFont = fontLoader.parse(json);
                    statusBanner.style.display = 'none'; generateKeychain();
                }, undefined, () => { showStatus('Failed to load TTF Font.', true); });
            } else {
                fontLoader.load(url, (font) => { 
                    loadedFont = font; statusBanner.style.display = 'none'; generateKeychain(); 
                }, undefined, () => { showStatus('Failed to load JSON Font.', true); });
            }
        }

        document.getElementById('fontUpload').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;
            showStatus('Parsing local font...');
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    loadedFont = fontLoader.parse(ttfLoader.parse(e.target.result));
                    document.getElementById('fontSelect').value = ""; 
                    statusBanner.style.display = 'none'; generateKeychain(); 
                } catch (error) { showStatus('Error: Invalid font file.', true); }
            };
            reader.readAsArrayBuffer(file);
        });

        // Function to build a single keychain item from an array of lines
        function buildSingleKeychain(linesArray, options) {
            const group = new THREE.Group();
            let textMeshes = [];
            let totalHeight = 0;
            let maxWidth = 0;
            const lineGap = 2;

            // 1. Generate text geometries with OPTIMIZED polygon counts to reduce STL size
            linesArray.forEach((line) => {
                let textGeo = new TextGeometry(line, { 
                    font: loadedFont, 
                    size: options.fontSize, 
                    height: options.targetTextDepth + options.sinkDepth, 
                    curveSegments: 4, // OPTIMIZED: Down from 12. Greatly reduces STL file size.
                    bevelEnabled: true, 
                    bevelThickness: 0.2, 
                    bevelSize: 0.1, 
                    bevelSegments: 2, // OPTIMIZED: Down from 3.
                    bevelOffset: 0
                });
                textGeo.computeBoundingBox();
                const w = textGeo.boundingBox.max.x - textGeo.boundingBox.min.x;
                const h = textGeo.boundingBox.max.y - textGeo.boundingBox.min.y;
                textGeo.translate(-0.5 * (textGeo.boundingBox.max.x + textGeo.boundingBox.min.x), -0.5 * (textGeo.boundingBox.max.y + textGeo.boundingBox.min.y), -textGeo.boundingBox.min.z);
                
                const mesh = new THREE.Mesh(textGeo, options.textMat);
                mesh.userData = { w: w, h: h };
                textMeshes.push(mesh);

                if (w > maxWidth) maxWidth = w;
                totalHeight += h;
            });

            totalHeight += (linesArray.length - 1) * lineGap;

            // 2. Arrange texts vertically
            let currentY = totalHeight / 2;
            textMeshes.forEach((mesh) => {
                mesh.position.y = currentY - (mesh.userData.h / 2);
                currentY -= (mesh.userData.h + lineGap);
                group.add(mesh);
            });

            // 3. Build Base Plate
            const baseW = maxWidth + (options.padding * 2);
            const baseH = totalHeight + (options.padding * 2);
            let finalW = maxWidth;
            let finalH = totalHeight;

            if (options.baseStyle !== 'none') {
                finalW = baseW; finalH = baseH;
                const shape = new THREE.Shape();
                const r = options.baseStyle === 'rounded' ? Math.min(options.padding, baseH / 2, baseW / 2) : 0;
                const x = -baseW / 2, y = -baseH / 2;

                // Create shape with curve segments explicitly set lower to match size reduction
                shape.moveTo(x, y + r); 
                shape.lineTo(x, y + baseH - r);
                shape.quadraticCurveTo(x, y + baseH, x + r, y + baseH);
                shape.lineTo(x + baseW - r, y + baseH); 
                shape.quadraticCurveTo(x + baseW, y + baseH, x + baseW, y + baseH - r);
                shape.lineTo(x + baseW, y + r); 
                shape.quadraticCurveTo(x + baseW, y, x + baseW - r, y);
                shape.lineTo(x + r, y); 
                shape.quadraticCurveTo(x, y, x, y + r);
                
                // Extrude settings optimized
                const plateMesh = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: options.baseThickness, bevelEnabled: false, curveSegments: 6 }), options.baseMat);
                plateMesh.castShadow = true; plateMesh.receiveShadow = true;
                group.add(plateMesh);
                
                textMeshes.forEach(m => m.position.set(m.position.x + options.nudgeX, m.position.y + options.nudgeY, options.baseThickness - options.sinkDepth));
            } else {
                textMeshes.forEach(m => m.position.set(m.position.x + options.nudgeX, m.position.y + options.nudgeY, 0));
            }

            // 4. Build Ring (Optimized Segments)
            const ringGeo = new THREE.TorusGeometry(options.ringRadius, options.ringTubeRadius, 10, 24); // OPTIMIZED: Down from 16,32
            ringGeo.translate(0, 0, options.ringTubeRadius);
            const ringMesh = new THREE.Mesh(ringGeo, options.baseMat);
            ringMesh.castShadow = true; ringMesh.receiveShadow = true;
            
            let rX = options.ringPos === 'left' ? -(finalW / 2) - options.ringRadius : (options.ringPos === 'right' ? (finalW / 2) + options.ringRadius : 0);
            let rY = options.ringPos === 'top' ? (finalH / 2) + options.ringRadius : (options.ringPos === 'bottom' ? -(finalH / 2) - options.ringRadius : 0);
            ringMesh.position.set(rX, rY, 0);
            group.add(ringMesh);

            return group;
        }

        function generateKeychain() {
            if (!loadedFont) return;
            
            keychainMesh.clear();
            helperGroup.clear();
            
            // FIX: Reset the global position of the group so it doesn't remember "Free" mode offsets!
            keychainMesh.position.set(0, 0, 0);

            const rawText = document.getElementById('nameInput').value;
            const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            if (lines.length === 0) lines.push("Empty");

            const mode = document.getElementById('genMode').value;
            const plateType = document.getElementById('printerPlate').value;

            // Collect Options
            const options = {
                textMat: new THREE.MeshStandardMaterial({ color: document.getElementById('textColorInput').value }),
                baseMat: new THREE.MeshStandardMaterial({ color: document.getElementById('plateColorInput').value }),
                fontSize: parseFloat(document.getElementById('fontSizeNum').value),
                targetTextDepth: parseFloat(document.getElementById('textDepthNum').value),
                sinkDepth: parseFloat(document.getElementById('sinkDepthNum').value),
                nudgeX: parseFloat(document.getElementById('nudgeXNum').value),
                nudgeY: parseFloat(document.getElementById('nudgeYNum').value),
                padding: parseFloat(document.getElementById('basePaddingNum').value),
                baseThickness: parseFloat(document.getElementById('baseThicknessNum').value),
                ringRadius: parseFloat(document.getElementById('ringSizeNum').value),
                ringTubeRadius: parseFloat(document.getElementById('ringThickNum').value) / 2,
                baseStyle: document.getElementById('baseStyle').value,
                ringPos: document.getElementById('ringPos').value,
                avoidPrimeTower: document.getElementById('primeTower').checked
            };

            let generatedGroups = [];

            if (mode === 'single') {
                generatedGroups.push(buildSingleKeychain(lines, options));
            } else {
                lines.forEach(line => {
                    generatedGroups.push(buildSingleKeychain([line], options));
                });
            }

            // Layout Engine
            if (plateType === 'none') {
                let offsetX = 0;
                generatedGroups.forEach(g => {
                    const box = new THREE.Box3().setFromObject(g);
                    g.position.x = offsetX - box.min.x;
                    keychainMesh.add(g);
                    offsetX += (box.max.x - box.min.x) + 5;
                });
                const fullBox = new THREE.Box3().setFromObject(keychainMesh);
                keychainMesh.position.x = - (fullBox.max.x + fullBox.min.x) / 2;
                keychainMesh.position.y = - (fullBox.max.y + fullBox.min.y) / 2;
            } else {
                const plateSize = plateType === 'a1mini' ? 180 : 256;
                
                const grid = new THREE.GridHelper(plateSize, plateSize / 10, 0x888888, 0x444444);
                grid.rotation.x = Math.PI / 2;
                grid.position.z = -0.1;
                helperGroup.add(grid);

                const ptZone = 45; 
                const ptVis = new THREE.Mesh(
                    new THREE.PlaneGeometry(ptZone, ptZone),
                    new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.3, depthWrite: false })
                );
                ptVis.position.set(plateSize/2 - ptZone/2, plateSize/2 - ptZone/2, 0);
                ptVis.visible = options.avoidPrimeTower; // Hide if disabled
                helperGroup.add(ptVis);

                const margin = 5;
                let cursorX = -plateSize/2 + margin;
                let cursorY = plateSize/2 - margin;
                let rowH = 0;
                const gap = 5;

                generatedGroups.forEach((g) => {
                    const box = new THREE.Box3().setFromObject(g);
                    const w = box.max.x - box.min.x;
                    const h = box.max.y - box.min.y;

                    // Next Row check
                    if (cursorX + w > plateSize/2 - margin) {
                        cursorX = -plateSize/2 + margin;
                        cursorY -= (rowH + gap);
                        rowH = 0;
                    }

                    // Prime Tower check
                    if (options.avoidPrimeTower && cursorY > plateSize/2 - ptZone - margin && cursorX + w > plateSize/2 - ptZone - margin) {
                        cursorX = -plateSize/2 + margin;
                        cursorY -= (rowH > 0 ? rowH : h) + gap;
                        rowH = 0;
                    }

                    g.position.x = cursorX - box.min.x;
                    g.position.y = cursorY - box.max.y;
                    keychainMesh.add(g);

                    cursorX += w + gap;
                    rowH = Math.max(rowH, h);
                });
            }
        }

        document.getElementById('exportBtn').addEventListener('click', () => {
            const exporter = new STLExporter();
            const link = document.createElement('a');
            link.href = URL.createObjectURL(new Blob([exporter.parse(keychainMesh)], { type: 'text/plain' }));
            link.download = 'keychain_batch.stl'; 
            link.click();
        });

        // --- EVENT LISTENERS ---
        const inputIds = ['fontSize', 'textDepth', 'sinkDepth', 'nudgeX', 'nudgeY', 'basePadding', 'baseThickness', 'ringSize', 'ringThick'];
        inputIds.forEach(id => {
            const s = document.getElementById(id), n = document.getElementById(id + 'Num');
            s.addEventListener('input', () => { n.value = s.value; generateKeychain(); });
            n.addEventListener('input', () => { s.value = n.value; generateKeychain(); });
        });
        
        ['baseStyle', 'ringPos', 'textColorInput', 'plateColorInput', 'nameInput', 'genMode', 'printerPlate', 'primeTower'].forEach(id => {
            document.getElementById(id).addEventListener('input', generateKeychain);
        });
        
        document.getElementById('fontSelect').addEventListener('change', loadSelectedFont);

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        loadSelectedFont();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (viewHelper.animating) {
                viewHelper.update(delta);
            } else {
                controls.update();
            }

            renderer.clear();
            renderer.render(scene, camera);
            viewHelper.render(renderer);
        }
        animate();
    </script>
</body>
</html>
